<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor Incidencias SKY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de trabajo diaria, clara y directa, como la mesa de control de un equipo de calidad.
   IDEA: una bandeja de casos, cada evaluación negativa es una ficha que avanza de "por notificar" a "finalizado".
   PICTURE: la propia bandeja de casos con su barra de avance por estado, arriba y grande.
   COLOUR and TYPE: azul Directo #0A50E6 dominante, azul profundo #0038DB, blanco; verde solo para finalizado en la cabecera, verde lima como único acento (avance, acciones), blanco; Manrope.
   LAYOUT: cabecera morada con cifras, pestañas, tabla de casos con editor desplegable; apilado en móvil. */
:root{color-scheme:light dark;
--sky:#0a50e6;--sky2:#0038db;--lime:#22c06b;--lime-ink:#ffffff;--ok:light-dark(#dcf5e7,#123b26);--ok-ink:light-dark(#0f6b3a,#7fe0a8);
--bg:light-dark(#f2f4fa,#0b1220);--card:light-dark(#ffffff,#111a2e);--ink:light-dark(#111827,#e8edf7);
--mut:light-dark(#5b6475,#9aa6bd);--line:light-dark(#e1e6f0,#22304d);--soft:light-dark(#eef2fb,#16223b);
--warn:light-dark(#fff1c2,#4a3a0c);--warn-ink:light-dark(#6b4e00,#ffe08a);--red:light-dark(#c62f47,#ff7d92);
--blue:light-dark(#2457c5,#8fb0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);color:var(--ink);padding:22px max(4vw,16px) 0;border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto}
h1{font-size:clamp(24px,3vw,34px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em}
h1{display:flex;align-items:center;gap:12px}h1 img{width:44px;height:44px;border-radius:10px;flex:none}
.cli{color:#7c048c}
:root[data-theme=dark] .cli{color:#d36be0}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
.btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}
header .btn.pri{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:#4d7ff0}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],input[type=email],textarea{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:6px 10px;font-size:16px;width:100%}
textarea{min-height:84px;resize:vertical}
.kpis{max-width:1280px;margin:20px auto 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden}
.kpi{background:var(--card);padding:12px 16px 14px}
.kpi .n small{font-size:14px;font-weight:600;color:var(--mut)}
.kg{background:var(--soft);padding:7px 16px;font-size:12px;font-weight:700;color:var(--mut)}
.kpi.sep,.kg+.kg{box-shadow:inset 3px 0 0 var(--sky)}
.kpi .n{font-size:clamp(24px,3vw,34px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--sky)}
:root[data-theme=dark] .kpi .n{color:#8fb4ff}
.kpi .l{font-size:12.5px;color:var(--ink)}
.kpi.hot .l{font-weight:700}
.bar{max-width:1280px;margin:0 auto;height:8px;display:flex;background:var(--soft);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
.bar i{display:block;height:100%}
.dias{max-width:1280px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:12px 0 16px}
.dia{flex:1 0 78px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px 8px 6px;text-align:left;cursor:pointer;min-height:44px}
.dia[aria-pressed=true]{background:var(--sky);color:#fff;border-color:var(--sky)}
.dia .t{color:var(--sky)}.dia[aria-pressed=true] .t{color:#fff}
.dia .d{font-size:12px;color:var(--mut);white-space:nowrap}.dia[aria-pressed=true] .d{color:#d6e2ff}.dia .t{font-size:18px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.dia .s{font-size:11.5px;white-space:nowrap}.dia .s b{color:var(--sky)}.dia[aria-pressed=true] .s b{color:#fff}
.dia .mb{height:4px;border-radius:2px;background:var(--soft);margin-top:5px;overflow:hidden}.dia .mb i{display:block;height:100%;background:var(--sky)}.dia[aria-pressed=true] .mb i{background:#fff}
.dia.vacio{opacity:.45}
nav{max-width:1280px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 max(4vw,16px)}
.tab{flex:none;border:0;background:none;padding:14px 14px 12px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:44px}
.tab[aria-selected=true]{color:var(--sky);border-color:var(--sky)}
:root[data-theme=dark] .tab[aria-selected=true]{color:#8fb4ff;border-color:#8fb4ff}
.tab .c{background:var(--soft);border-radius:20px;padding:1px 8px;font-size:12px;margin-left:6px}
.navwrap{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
main{max-width:1280px;margin:0 auto;padding:20px max(4vw,16px) 60px}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.filters label,.f label{font-size:12.5px;color:var(--mut);font-weight:600;display:block;margin-bottom:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-pn{background:var(--soft);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
.st-pl{background:light-dark(#fff3bf,#4a3d07);color:light-dark(#6b5200,#ffe27a)}

.st-pr{background:light-dark(#ffe1c4,#4d2a0a);color:light-dark(#9a4a00,#ffb26b)}
.st-fi{background:var(--ok);color:var(--ok-ink)}
.tr-i{color:var(--red);font-weight:700}.tr-a{color:var(--warn-ink);font-weight:700}
.stars{color:#e0a800;letter-spacing:1px;white-space:nowrap}
td.plan{max-width:260px;font-size:13px;color:var(--mut)}.add{color:var(--sky);font-weight:700;white-space:nowrap}
.caso{font-weight:600}.tag{display:block;font-size:11.5px;font-weight:700;margin-top:2px}
.rep th.p{background:#7030a0;color:#fff}.rep th.d{background:var(--sky);color:#fff}
.ia{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.ed td{background:var(--soft);padding:16px}
.edgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.edgrid .w2{grid-column:span 2}.edgrid .w4{grid-column:1/-1}
.quote{background:var(--card);border-left:4px solid var(--sky);padding:10px 12px;border-radius:6px}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.dk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.dk>div{background:var(--card);padding:12px 16px}.dk .n{font-size:28px;font-weight:800;color:var(--sky);line-height:1.1}.dk .n.r{color:var(--red)}.dk .l{font-size:13px}.dk .h{font-size:12px;color:var(--mut)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.ph h3{margin:0;font-size:15px}.ph span{font-size:12px;color:var(--mut)}
.hb{padding:10px 16px 14px}.hb div{display:grid;grid-template-columns:minmax(0,1fr) 120px 32px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.hb i{display:block;height:10px;border-radius:5px;background:var(--sky)}.hb b{text-align:right;font-variant-numeric:tabular-nums}
.lv{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.lv-c{background:light-dark(#fde0e5,#4d1520);color:var(--red)}.lv-a{background:var(--warn);color:var(--warn-ink)}
.tg{display:inline-block;font-size:11.5px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:1px 3px 1px 0}
.sub2 td{background:var(--soft);font-size:13px}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}.dk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cards{display:grid;gap:14px}
.mail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.mail h3{margin:0 0 6px;font-size:16px}
.meta{font-size:13px;color:var(--mut);display:grid;gap:2px;margin-bottom:10px}
.meta b{color:var(--ink);font-weight:600}
.prev{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:#1d1426;overflow-x:auto;font-size:13px}
.prev table{font-size:12px}.prev th{background:#0a50e6;color:#fff}.prev td,.prev th{border:1px solid #bbb;padding:5px}
h2{font-size:20px;margin:6px 0 12px}
.note{font-size:13px;color:var(--mut)}
footer{max-width:1280px;margin:0 auto;padding:18px max(4vw,16px) 32px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
footer a{color:var(--sky)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1}
.drop{border:2px dashed #4d7ff0;border-radius:14px;padding:18px;background:var(--card);margin-bottom:16px}
.f{margin-bottom:10px}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
.cfg td{padding:6px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kg{grid-column:1/-1!important}.kpi.sep{box-shadow:none}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.edgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mut);font-size:12px}.stack td:empty{display:none}.stack tr.row{border-bottom:1px solid var(--line)}.edgrid{grid-template-columns:minmax(0,1fr)}.edgrid .w2{grid-column:auto}.stack .ed td{padding-inline-start:12px}.stack .ed td::before{display:none}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

lo"], ["sucio", "olor", "olia", "huele", "se le paraba el auto", "incomod", "asiento"]], ["Protocolo de servicio", "Ficha, combustible, identificación", "Supply (conductor)", ["ficha del conductor"], ["recargar gasolina", "fichas de conductor", "no se acerco", "maletera"]]], "neg": ["no ", "mal", "pesim", "tarde", "tardi", "demor", "huele", "olia", "olor", "sucio", "incomod", "peligro", "falt", "nunca", "deberia", "tuve que", "tuve q", "esper", "reclamo", "queja", "lamentable", "demasiado temprano", "pero ", "sin embargo", "revisar", "excesiv"], "pos": ["amabilidad del conductor", "limpieza/estado del vehiculo", "muy cortes", "planificacion de ruta", "seguridad"], "prio": ["Conductor con posibles signos de fatiga y somnolencia", "Seguridad vial", "Planificación de ruta", "Puntualidad", "Navegación del conductor", "Trato del conductor", "Climatización", "Estado del vehículo", "Protocolo de servicio"]};

const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();

// ---------- clasificación (misma lógica del Excel) ----------
function classify(est, etiq, texto) {
  const t = " " + norm(texto) + " ";
  const ok = est <= 3 || K.neg.some(n => t.includes(n));
  let first = null; const subs = [];
  for (const [tipo, sub, area, tags, kws] of K.cat) {
    let hit = etiq.some(e => { let n = norm(e); const q = n.startsWith("["); if (q && n.includes("]")) n = n.slice(n.indexOf("]")+1).trim(); return (q || est <= 3) && tags.includes(n); });
    if (!hit && (ok || tipo.includes("somnolencia"))) hit = kws.some(k => t.includes(k));   // somnolencia se marca siempre, aunque la calificación sea alta
    if (hit) { if (!subs.includes(sub)) subs.push(sub); if (!first) first = [tipo, area]; }
  }
  if (first) return {tipo:first[0], area:first[1], subt:subs.join("; ")};
  return est <= 3 ? {tipo:"Sin detalle", area:"Customer Care (revisar)", subt:""} : {tipo:"", area:"", subt:""};
}

function build() {
  rows = [];
  for (const f of Object.keys(dias).sort()) for (const e of (dias[f].evals || [])) {
    const c = classify(e.est, e.etiq || [], e.texto || "");

    const tipoReg = g.tipoReg || (e.est <= 3 ? LI : (c.tipo ? LA : LP));
    const area = g.area ?? c.area;
    rows.push({ ...e, fecha:f, tipoReg,
      coment: [e.texto, (e.etiq||[]).join(" | ")].filter(Boolean).join(" | "),

      estado: tipoReg === LP ? "" : (g.estado || ""), ffin: g.ffin || "", cdir: g.cdir || "", fcont: g.fcont || "", fcierre: g.fcierre || "" });
  }
}
const gestionables = r => r.tipoReg !== LP;

const addD = (s, n) => { const d = toDate(s); d.setDate(d.getDate()+n); return iso(d); };
const lunes = s => { const d = toDate(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); };
const semNum = s => { const d = toDate(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const y = new Date(d.getFullYear(),0,4); return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7); };
const NM = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"], ND = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
function rango() {   // [desde, hasta] del periodo elegido
  const m = F.mes || "";
  if (m.startsWith("W:")) return [m.slice(2), addD(m.slice(2), 6)];
  if (m.startsWith("D:")) return [m.slice(2), m.slice(2)];
  if (m.length === 7) { const d = new Date(+m.slice(0,4), +m.slice(5,7), 0); return [m+"-01", iso(d)]; }
  return ["", "9999"];
}
const inMes = r => { const [a,b] = rango(); return r.fecha >= a && r.fecha <= b; };

// ---------- cabecera ----------
function renderDias(sel) {
  let dias = [], tipo = "dia";
  const base = sel.startsWith("D:") ? "W:" + lunes(sel.slice(2)) : sel;
  if (base.startsWith("W:")) { for (let i = 0; i < 7; i++) dias.push(addD(base.slice(2), i)); }
  else if (base.length === 7) { const [a,b] = rango(); for (let d = a; d <= b; d = addD(d,1)) dias.push(d); }
  else { tipo = "sem"; dias = [...new Set(rows.map(r => lunes(r.fecha)))].sort(); }
  const cel = dias.map(d => {
    const L = rows.filter(r => tipo === "sem" ? lunes(r.fecha) === d : r.fecha === d);
    const inc = L.filter(r => r.tipoReg === LI).length, ale = L.filter(r => r.tipoReg === LA).length;
    const g = L.filter(gestionables), fin = g.filter(r => r.estado === "Finalizado").length;
    const lab = tipo === "sem" ? `Sem ${semNum(d)} · ${+d.slice(8)} ${NM[+d.slice(5,7)-1]}` : `${ND[toDate(d).getDay()]} ${+d.slice(8)} ${NM[+d.slice(5,7)-1]}`;
    const val = tipo === "sem" ? "W:"+d : "D:"+d;
    return `<button class="dia ${L.length?"":"vacio"}" data-per="${val}" aria-pressed="${sel===val}" title="${L.length} evaluaciones · ${inc} de 1-3★ · ${ale} de 4-5★ con queja · ${fin} de ${g.length} finalizados">
      <div class="d">${lab}</div><div class="t">${L.length}</div><div class="s">${g.length ? `<b>${g.length}</b> a gestionar` : "sin casos"}</div>
      <div class="mb"><i style="width:${g.length ? fin*100/g.length : 0}%"></i></div></button>`;
  }).join("");
  $("#dias").innerHTML = cel;
}

function renderHead() {
  const fechas = rows.map(r => r.fecha).sort();
  const ultima = fechas[fechas.length-1] || "";
  if (F.mes === null && ultima) F.mes = "W:" + lunes(ultima);
  const semanas = [...new Set(fechas.map(lunes))].sort().reverse();
  const meses = [...new Set(fechas.map(f => f.slice(0,7)))].sort().reverse();
  const sel = F.mes || "";
  const dsel = sel.startsWith("D:") ? `<option value="${sel}" selected>Día ${fdate(sel.slice(2))}</option>` : "";
  $("#mes").innerHTML = dsel + `<optgroup label="Semanas">${semanas.map(w => { const h = addD(w,6); return `<option value="W:${w}" ${sel==="W:"+w?"selected":""}>Sem ${semNum(w)} · ${+w.slice(8)} ${NM[+w.slice(5,7)-1]} – ${+h.slice(8)} ${NM[+h.slice(5,7)-1]}</option>`; }).join("")}</optgroup>`
    + `<optgroup label="Meses">${meses.map(m => `<option value="${m}" ${sel===m?"selected":""}>${NM[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join("")}</optgroup>`
    + `<option value="" ${sel===""?"selected":""}>Todo el periodo</option>`;
  if (conectado) $("#dbst").textContent = ultima ? `datos cargados hasta el ${fdate(ultima)}` : "sin datos cargados";
  renderDias(sel);
  const p = rows.filter(inMes), g = p.filter(gestionables);
  const n = s => g.filter(r => r.estado === s).length;
  const fin = n("Finalizado"), pn = n(""), pl = n("En planificación"), pr = n("En proceso");
  const inc = p.filter(r => r.est <= 3).length, alt = p.filter(r => r.est >= 4).length;
  // porcentajes con resto mayor: los de un mismo grupo suman exactamente 100%
  const pct100 = (vals, tot) => { if (!tot) return vals.map(() => 0);
    const raw = vals.map(v => v*1000/tot), out = raw.map(Math.floor);
    let rest = 1000 - out.reduce((a,b) => a+b, 0);
    raw.map((v,i) => [v - out[i], i]).sort((a,b) => b[0]-a[0]).forEach(([f,i]) => { if (rest > 0 && f > 1e-9) { out[i]++; rest--; } });
    return out.map(x => x/10); };
  const sm = v => `<small>${String(Number.isInteger(v) ? v : v.toFixed(1)).replace(".", ",")}%</small>`;
  const [pAlt, pInc] = pct100([alt, inc], p.length);
  const [pPn, pPl, pPr, pFin] = pct100([pn, pl, pr, fin], g.length);
  const cell = (l, v, c) => `<div class="kpi ${c||""}"><div class="n">${v}</div><div class="l">${l}</div></div>`;
  $("#kpis").innerHTML = `<div class="kg" style="grid-column:span 3">Evaluaciones de pasajeros</div><div class="kg" style="grid-column:span 4">Estado del plan de acción o acción correctiva</div>`
    + cell("Total de evaluaciones", p.length + " " + sm(p.length ? 100 : 0)) + cell("Calificaciones 4-5★", alt + " " + sm(pAlt)) + cell("Calificaciones 1-3★", inc + " " + sm(pInc))
    + cell("Pendiente", pn + " " + sm(pPn), "sep" + (pn ? " hot" : "")) + cell("En planificación", pl + " " + sm(pPl)) + cell("En proceso", pr + " " + sm(pPr)) + cell("Finalizados", fin + " " + sm(pFin));
  const tot = g.length || 1;
  $("#bar").innerHTML = [[fin,"var(--sky)"],[pr,"#6f9bf2"],[pl,"#b9cdf8"],[pn,"transparent"]].map(([v,c]) => `<i style="width:${v*100/tot}%;background:${c}"></i>`).join("");
  const porNot = rows.filter(r => gestionables(r) && r.estado === "").length;
  document.querySelectorAll(".tab").forEach(b => { b.setAttribute("aria-selected", b.dataset.t === tab);
    if (b.dataset.t === "correos") b.innerHTML = `Correos${porNot ? `<span class="c">${grupos("").length}</span>` : ""}`; });
}

    && (F.estado === "todos" || (F.estado === "abiertos" ? r.estado !== "Finalizado" : stLabel(r.estado) === F.estado))
    && (!F.area || r.area === F.area) && (!F.tipo || r.tipoInc === F.tipo)
    && (!q || norm([r.ruta,r.cond,r.dni,pasNom(r),r.coment,r.unidad,r.plan].join(" ")).includes(q))).reverse();
}

const esSupply = r => norm(r.area).startsWith("supply");

function ventana() {
  let [a, b] = rango(); const maxF = rows.reduce((m, r) => r.fecha > m ? r.fecha : m, "");
  if (b === "9999" || b > maxF) b = maxF || b;
  if (DV === "per") return [a, b];
  if (DV === "all") return ["", b];

}
function agrupar(L, key) {
  const m = new Map(); L.forEach(r => { const k = key(r); if (!k) return; if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.values()].map(c => c.sort((x, y) => y.fecha.localeCompare(x.fecha)));
}

// ---------- Importar descarga de Llegando ----------
function txt(v) { if (v == null) return ""; if (v instanceof Date) return v.toISOString().slice(0,10); return String(v).replace(/[\r\n\t]+/g," ").trim(); }
function parseFecha(v) {
  if (v instanceof Date) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  const s = txt(v).split(" ")[0].replace(/\//g,"-"); const p = s.split("-");
  if (p.length !== 3) return "";
  return p[0].length === 4 ? `${p[0]}-${p[1].padStart(2,"0")}-${p[2].padStart(2,"0")}` : `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
}
const safe = s => s.replace(/[^A-Za-z0-9_\-.~:@+]/g, "-");
const titulo = s => s.toLowerCase().replace(/(^|[^a-záéíóúñü])([a-záéíóúñü])/g, (m,a,b) => a + b.toUpperCase());
function parseLlegando(aoa) {
  let h = -1;
  for (let r = 0; r < Math.min(30, aoa.length); r++) { const n = (aoa[r]||[]).map(c => norm(txt(c))); if (n.includes("stars") && n.some(x => x.startsWith("ruta"))) { h = r; break; } }
  if (h < 0) throw new Error("No encontré los encabezados (Ruta / stars) en el archivo.");
  const H = aoa[h].map(c => norm(txt(c))); const col = f => H.findIndex(f);
  const cD = col(x => x.startsWith("dia") || x.startsWith("fecha")), cR = col(x => x.startsWith("ruta")), cP = col(x => x.startsWith("dispositivo")),
        cN = col(x => x === "nid"), cC = col(x => x.startsWith("comentario")), cS = col(x => x === "stars");
  const out = []; let cur = null, dia = "", ruta = "", disp = "", stars = -1;
  const push = () => { if (!cur || cur.est < 1) return;
    const m = /^(\d+)_(.*)$/.exec(cur.disp); const unidad = m ? +m[1] : ""; const cond = titulo((m ? m[2] : cur.disp).replace(/_/g," ").trim());
    out.push({fecha:parseFecha(cur.dia), ruta:cur.ruta, unidad, cond, dni:cur.nid, est:cur.est, texto:cur.tx.join(" | "), etiq:cur.et}); };
  for (let r = h+1; r < aoa.length; r++) {
    const row = aoa[r] || []; const g = c => c >= 0 ? row[c] : null;
    const vD = g(cD), vR = txt(g(cR)), vP = txt(g(cP)), vN = txt(g(cN)), vC = txt(g(cC)), vS = txt(g(cS));
    if (!(txt(vD) || vR || vP || vN || vC || vS)) continue;
    const st = /^\d+$/.test(vS) ? +vS : stars;
    if (txt(vD)) dia = vD;
    if (vR || vN || st !== stars || !cur) {
      push();
      if (vR) { ruta = vR; disp = vP; } else if (vP) disp = vP;
      stars = st; cur = {dia, ruta, disp, nid:vN, est:st, et:[], tx:[]};
    }
    if (vC && !((vC.length <= 2 && /[^A-Za-z]/.test(vC)) || norm(vC) === "n/a")) {
      const L = (vC.startsWith("[") || POS.has(norm(vC))) ? cur.et : cur.tx; if (!L.includes(vC)) L.push(vC);
    }
  }
  push();
  return out;
}
function prepararImport(evs) {
  const keys = new Set(), ids = new Set();
  for (const r of rows) { ids.add(r.id); keys.add(r.id.replace(/-\d+$/,"") + "|" + norm(r.coment).slice(0,40)); }
  const nuevas = []; let dup = 0;
  for (const e of evs) {
    if (!e.fecha) continue;
    const base = safe(`${e.fecha}_${e.ruta||"sinruta"}_${e.dni||"x"}_${e.est}`);
    const coment = [e.texto, e.etiq.join(" | ")].filter(Boolean).join(" | ");
    const k = base + "|" + norm(coment).slice(0,40);
    if (keys.has(k)) { dup++; continue; }
    keys.add(k); let id = base, n = 2; while (ids.has(id)) id = `${base}-${n++}`; ids.add(id);
    nuevas.push({...e, id});
  }
  return {nuevas, dup};
}
let imp = null;
async function leerArchivo(file) {
  if (!window.XLSX) { toast("No se pudo cargar la librería de Excel"); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type:"array", cellDates:true});
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:null});
    const evs = parseLlegando(aoa); const {nuevas, dup} = prepararImport(evs);
    const cls = nuevas.map(e => ({e, c:classify(e.est, e.etiq, e.texto)}));
    imp = {nombre:file.name, nuevas, dup, nInc:cls.filter(x => x.e.est <= 3).length, nAle:cls.filter(x => x.e.est > 3 && x.c.tipo).length};
    tab = "casos"; render();

}

async function confirmarImport() {

      $("#dbst").textContent = "inicia sesión para ver los datos";
      $("#main").innerHTML = `<div class="empty"><p>Ingresa con tu cuenta de Google autorizada para ver y gestionar las incidencias.</p><button class="btn pri" id="login">Ingresar con Google</button></div>`;
      $("#login").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => toast("No se pudo ingresar: " + (e.message||e.code)));
      return; }
    db = firebase.firestore();
    $("#usr").innerHTML = ` · ${esc(user.email)} · <a href="#" id="logout" style="color:var(--sky)">salir</a>`;
    $("#dbst").textContent = "conectando…";
    const sinAcceso = err => { $("#dbst").textContent = err.code === "permission-denied" ? "tu cuenta no tiene acceso: pide que la agreguen a la lista autorizada" : "error de base de datos: " + err.code;
      $("#main").innerHTML = `<div class="empty">La cuenta ${esc(user.email)} no está autorizada para ver estos datos.</div>`; };
    let listo = {d:false, g:false};
    const ok = () => { if (listo.d && listo.g) conectado = true; render(); };
    unsub.push(db.collection("dias").onSnapshot(s => { dias = {}; s.docs.forEach(d => dias[d.id] = d.data()); if (!s.metadata.fromCache) listo.d = true; ok(); }, sinAcceso));
    unsub.push(db.collection("gestion").onSnapshot(s => { gest = {}; s.docs.forEach(d => gest[d.id] = d.data()); if (!s.metadata.fromCache) listo.g = true; ok(); }, () => {}));
    unsub.push(db.doc("flota/main").onSnapshot(s => { if (s.exists) { flota = {f:[], m:{}, ...s.data()}; $("#flbtn").title = `Flota cargada al ${fdate(flota.fecha)} (${flota.n} móviles).`; render(); } }, () => {}));
    unsub.push(db.doc("colab/main").onSnapshot(s => { if (s.exists) { colab = {m:{}, ...s.data()}; render(); } }, () => {}));
    unsub.push(db.doc("config/main").onSnapshot(s => { if (s.exists) cfg = {...cfg, ...s.data()}; render(); }, () => {}));
  });
  document.addEventListener("click", e => { if (e.target.id === "logout") { e.preventDefault(); auth.signOut(); } });
})();

}
</script>
</body>
</html>
